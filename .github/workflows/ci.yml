name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check published speaker-attribution quality floor
        run: python evals/run_speaker_eval.py --fail-below 0.90
      - name: Compile all Python files
        run: python -m compileall -q audiobook_app
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Check POSIX launcher syntax
        run: bash -n Start-VoxCast.command Start-VoxCast.sh
