[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-character-audiobook"
version = "0.10.0"
description = "A consumer-first alpha for automatic multi-character audiobook casting"
requires-python = ">=3.10"
authors = [{ name = "MultiVoice Audiobook Team" }]
dependencies = ["pypdf>=5.0,<7"]

[project.optional-dependencies]
neural = [
    "edge-tts>=7.2,<8",
    "miniaudio>=1.61,<2",
]

[tool.setuptools.packages.find]
include = ["audiobook_app*"]
